name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Validate the synthetic sample ledger
        run: uv run bean-check sample/smoke.beancount && uv run bean-check sample/family-model.beancount

      - name: Run tests (including both privacy guards)
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check .
